name: Build Android APK

# Runs on GitHub's own runners, which already have the Android SDK
# preinstalled — this is the build path we couldn't do in the dev sandbox
# (no Android SDK there, and its network policy blocks fetching one).
on:
  push:
    branches:
      - claude/app-ux-ui-improvement-wgrde3
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL to bake into the build (leave empty for the Render deployment)"
        required: false
        default: "https://language-learning-backend-9qhk.onrender.com"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: stable

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=AI_API_BASE_URL=${{ github.event.inputs.api_base_url || 'https://language-learning-backend-9qhk.onrender.com' }}

      - uses: actions/upload-artifact@v4
        with:
          name: learning-app-debug-apk
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
