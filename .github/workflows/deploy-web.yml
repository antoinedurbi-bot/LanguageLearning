name: Deploy web build to GitHub Pages

on:
  push:
    branches:
      - claude/app-ux-ui-improvement-wgrde3
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL to bake into the build"
        required: false
        default: "https://language-learning-backend-9qhk.onrender.com"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: stable

      - run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release \
            --base-href /LanguageLearning/ \
            --dart-define=AI_API_BASE_URL=${{ github.event.inputs.api_base_url || 'https://language-learning-backend-9qhk.onrender.com' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
