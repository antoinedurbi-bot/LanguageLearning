name: learning_app
description: Language learning app with Firebase and AI features.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.6.0
  firebase_auth: ^5.3.4
  firebase_core: ^3.9.0
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  flutter_tts: ^4.2.5
  flutter_svg: ^2.0.17
  rive: ^0.13.20
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # Generated by tools/build_hanzi_assets.py — do not edit by hand.
    # Declared as a directory so a newly generated file is bundled without
    # anyone having to remember to add it here.
    - assets/data/
    # OpenMoji (CC BY-SA 4.0, https://openmoji.org) — see assets/illustrations/CREDITS.md.
    - assets/illustrations/
    # rive-flutter example asset (MIT) — see assets/rive/CREDITS.md.
    - assets/rive/

  # Fonts are bundled rather than fetched at runtime: the app is designed to
  # work offline, and a network-dependent typeface would leave the first launch
  # rendering in a fallback face.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
